name: Merge Upstream Sync

on:
  schedule:
    - cron: '0 0,12 * * *' # Runs twice a day
  workflow_dispatch:       # Allows manual triggering for urgent bug fixes

jobs:
  merge-sync:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout your fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT }}
          
      - name: Merge changes from Upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add upstream remote and fetch all branches
          git remote add upstream https://github.com/Saranga2000-Creater/FixGo-Web-Application.git
          git fetch upstream
          
          # 1. Sync the 'main' branch
          git checkout main
          git merge upstream/main --no-edit
          git push origin main
          
          # 2. Sync the 'dockerCI/CD' branch
          # Checkout the dockerCI/CD branch from origin (your fork)
          git checkout -B dockerCI/CD origin/dockerCI/CD
          # Merge the upstream dockerCI/CD branch into it
          git merge upstream/dockerCI/CD --no-edit
          # Push the updated branch back to your fork
          git push origin dockerCI/CD
